name: telekinesis_medium
description: >-
  Medium for Dart/Flutter — annotations plus a build_runner builder that emits
  the telekinesis.medium.json sidecar manifest Telekinesis merges onto the
  app's accessibility tree. Deterministic, no LLM, no network.
version: 0.1.0
repository: https://github.com/egarim/telekinesis
environment:
  sdk: ^3.10.0

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  build: ^4.0.0
  glob: ^2.1.0

dev_dependencies:
  build_test: ^3.0.0
  test: ^1.25.0
