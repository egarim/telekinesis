name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signature storage lives on the orphan branch named by `branch:` below,
          # NOT on main. The action reads that file but never creates the branch, so
          # if it goes missing every run that inspects signatures dies while setting
          # up storage -- excerpt from a real failure:
          #   "Error occurred when creating the signed contributors file: Branch
          #    cla-signatures not found. Make sure the branch where signatures are
          #    stored is NOT protected."
          # and then fails the check with "Committers of pull request N have to sign
          # the CLA". Being on `allowlist` does not save you: PRs #63, #64 and #66
          # all failed while every commit was authored by an allowlisted, linked
          # account. Runs for a `closed` event stay green because they only lock the
          # merged PR and never read the file, which is what made the outage look
          # intermittent rather than total.
          # The branch must exist, must contain this file (a JSON object with an
          # empty signedContributors array), and must stay unprotected because the
          # action commits signature updates to it with GITHUB_TOKEN under this
          # workflow's `contents: write`. See CONTRIBUTING.md.
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/egarim/telekinesis/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'egarim,bot*'
          custom-notsigned-prcomment: >
            Thanks for the contribution! Telekinesis is dual-licensed, so we need you to
            sign the [Contributor License Agreement](https://github.com/egarim/telekinesis/blob/main/CLA.md)
            before this can merge — just post the comment below.
